# Declaracion minima de VERSION, anadida 2026-09-15.
#
# Por que existe este fichero: la ley de caducidad de exenciones (ADR-0013 D4,
# decision de Luis) exige que toda exencion `sunset-reviewed:` lleve un
# MAJOR.MINOR contra el que vencer. Un repo que no declara version no tiene
# reloj, asi que ninguna de sus exenciones puede caducar nunca -- el mismo
# agujero que el literal `permanent` que se abolio ese dia, un nivel mas
# arriba. `sunset_audit` lee exactamente `[project].version`.
#
# 0.1.0 es la primera version declarada: el repo no tenia ninguna y no hay etiquetas previas que honrar.
[project]
name = "red_python"
version = "0.1.0"

# Reglas de ruff que el kit declara obligatorias (adversarial_judge las exige nombradas). Ruff ya
# trae por defecto E4, E7, E9 y F; se listan aqui explicitas junto con las de complejidad, que no
# vienen por defecto. Medido el 2026-09-26: `ruff check .` con esta lista da 0 hallazgos.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "F632", "F811", "F821", "C901", "PLR0912", "PLR0913", "PLR0915"]

