# .pre-commit-config.yaml -- simplecode canonical preventive gates (enforced)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--select, "E9,F821,F632,F811,C901,PLR0912,PLR0913,PLR0915"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: [--no-banner, --redact]

  - repo: local
    hooks:
      - id: unselected-rules
        name: unselected-rules (GS2-192 mandatory quality rules)
        entry: python -m simplecode.guards.unselected_rules --gate
        language: system
        pass_filenames: false

      - id: corruption-guard
        name: corruption-guard (UTF-8, BOM, NUL, mojibake, zero-width)
        entry: python -m simplecode.guards.corruption_guard
        language: system
        pass_filenames: false

      - id: angry-path
        name: "angry-path (Rule B3: no silent error swallowing)"
        entry: python -m simplecode.guards.angry_path --gate
        language: system
        pass_filenames: false

      - id: staged-parity
        name: staged-parity (index vs working tree)
        entry: python -m simplecode.worktree.staged_parity
        language: system
        pass_filenames: false

      - id: truncation-guard
        name: truncation-guard (integrity of edits)
        entry: python -m simplecode.guards.truncation_guard
        language: system
        types_or: [python, json, toml]

      - id: zero-debt
        name: zero-debt (staged, blocks)
        entry: python -m simplecode.worktree.zero_debt --root . --mode zero --staged --gate
        language: system
        pass_filenames: false

      - id: backlog-verifier
        name: backlog-verifier (no unearned done tasks)
        entry: python -m simplecode.verification.backlog_verifier --gate
        language: system
        pass_filenames: false

      - id: coverage-ratchet
        name: coverage-ratchet (monotonic coverage floor)
        entry: python -m simplecode.worktree.coverage_ratchet --gate
        language: system
        pass_filenames: false

      - id: test-timer-guard
        name: test-timer-guard (enforces sub-2s unit test speed ceiling)
        entry: python -m simplecode.verification.test_timer_guard --max-seconds 2.0 --gate
        language: system
        pass_filenames: false

      - id: clean-worktree
        name: clean_worktree (observe)
        entry: python -m simplecode.worktree.clean_worktree
        language: system
        pass_filenames: false
